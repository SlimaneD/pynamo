[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pynamo-egt"
version = "0.3.4"
description = "pyNamo-EGT: plotting and analysis tools for replicator dynamics in evolutionary games."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Slimane Dridi" },
    { name = "Benjamin Giraudon" },
]
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
    "sympy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
notebook = [
    "ipykernel",
    "ipympl",
    "ipywidgets",
    "jupyter",
]
dev = [
    "pytest",
]
docs = [
    "ipykernel>=6.25",
    "ipympl>=0.9.3",
    "ipywidgets>=8.1",
    "myst-nb>=1.1",
    "numpydoc>=1.8",
    "pydata-sphinx-theme>=0.16",
    "sphinx>=8",
    "sphinx-gallery>=0.17",
]

[project.urls]
Repository = "https://github.com/SlimaneD/pynamo"
Issues = "https://github.com/SlimaneD/pynamo/issues"

[tool.setuptools.packages.find]
include = ["pynamo_egt", "pynamo_egt.*"]
