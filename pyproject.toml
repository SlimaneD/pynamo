[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pynamo-egt"
version = "0.3.4"
description = "pyNamo-EGT: plotting and analysis tools for replicator dynamics in evolutionary games."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Slimane Dridi" },
    { name = "Benjamin Giraudon" },
]
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1.1",
    "scipy>=1.11.2",
    "sympy>=1.12",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=6.25",
    "ipympl>=0.9.3",
    "ipywidgets>=8.1",
    "jupyter>=1.0",
]
plotly = [
    "plotly>=5.18",
]
dev = [
    "pytest>=7.4",
]

[project.urls]
Repository = "https://github.com/SlimaneD/pynamo"
Issues = "https://github.com/SlimaneD/pynamo/issues"

[tool.setuptools.packages.find]
include = ["pynamo_egt", "pynamo_egt.*"]
