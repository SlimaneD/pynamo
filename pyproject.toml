[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pynamo-egt"
version = "0.3.4"
description = "pyNamo-EGT: plotting and analysis tools for replicator dynamics in evolutionary games."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Slimane Dridi" },
    { name = "Benjamin Giraudon" },
]
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "scipy",
    "sympy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
notebook = [
    "ipykernel",
    "ipympl",
    "ipywidgets",
    "jupyter",
]
dev = [
    "pytest",
]

[project.urls]
Repository = "https://github.com/SlimaneD/pynamo"
Issues = "https://github.com/SlimaneD/pynamo/issues"

[tool.setuptools.packages.find]
include = ["pynamo_egt", "pynamo_egt.*"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = [
    "pynamo_egt/__init__.py:__version__",
    "CITATION.cff:version",
]
tag_format = "v{version}"
commit_parser = "conventional"
major_on_zero = false
allow_zero_version = true
commit_message = "chore(release): {version}\n\nAutomatically generated by python-semantic-release"

[tool.semantic_release.branches.master]
match = "master"
prerelease = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.changelog]
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
