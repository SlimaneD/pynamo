name: Feature request
description: Suggest a new game class, dynamic, analysis or plotting option.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the research or teaching task, and what is missing or hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work? A code sketch of the API you'd like is welcome.
  - type: textarea
    id: references
    attributes:
      label: References
      description: Papers, textbooks or other software (e.g. Dynamo, EGTtools) that describe the feature.
