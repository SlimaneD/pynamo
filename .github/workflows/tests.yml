name: Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with test extras
        run: python -m pip install -e ".[dev,plotly]"
      - name: Run tests
        run: python -m pytest -q

  oldest-dependencies:
    name: pytest (oldest declared dependencies, Python 3.12)
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true
      - name: Install the lowest versions allowed by pyproject.toml
        run: uv pip install --resolution lowest-direct -e ".[dev,plotly]"
      - name: Show resolved versions
        run: uv pip list
      - name: Run tests
        run: python -m pytest -q
